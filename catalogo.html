<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrigamiECJ — Catálogo</title>
  <meta name="description" content="Catálogo de modelos de origami." data-i18n-attr="content:meta.description.catalog">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/site.js"></script>
  <script type="module" src="js/catalog.js"></script>
</head>
<body data-page="catalog">
  <header id="site-header"></header>

  <main id="main" tabindex="-1">
    <div class="wrap">
      <nav class="breadcrumb" aria-label="Trilha de navegação" data-i18n-attr="aria-label:common.breadcrumb">
        <ol>
          <li><a href="index.html" data-i18n="nav.home"></a></li>
          <li aria-current="page" data-i18n="nav.catalog"></li>
        </ol>
      </nav>

      <h1 data-i18n="catalog.title"></h1>
      <p data-i18n="catalog.intro"></p>

      <section aria-labelledby="filters-title">
        <h2 id="filters-title" data-i18n="catalog.filtersTitle"></h2>
        <form class="filters" id="catalog-filters">
          <div class="field filter-search">
            <label for="filter-search" data-i18n="catalog.search"></label>
            <input type="search" id="filter-search" name="query" autocomplete="off" data-i18n-attr="placeholder:catalog.searchPlaceholder">
          </div>
          <div class="field">
            <label for="filter-difficulty" data-i18n="catalog.difficulty"></label>
            <select id="filter-difficulty" name="difficulty">
              <option value="all" data-i18n="catalog.all"></option>
              <option value="facil" data-i18n="difficulty.facil"></option>
              <option value="medio" data-i18n="difficulty.medio"></option>
              <option value="dificil" data-i18n="difficulty.dificil"></option>
            </select>
          </div>
          <div class="field">
            <label for="filter-type" data-i18n="catalog.type"></label>
            <select id="filter-type" name="type">
              <option value="all" data-i18n="catalog.all"></option>
              <option value="brinquedos" data-i18n="category.brinquedos"></option>
              <option value="utilidades" data-i18n="category.utilidades"></option>
              <option value="animais" data-i18n="category.animais"></option>
              <option value="flores" data-i18n="category.flores"></option>
              <option value="objetos" data-i18n="category.objetos"></option>
              <option value="decoracao" data-i18n="category.decoracao"></option>
            </select>
          </div>
          <div class="field">
            <label for="filter-time" data-i18n="catalog.time"></label>
            <select id="filter-time" name="time">
              <option value="all" data-i18n="catalog.all"></option>
              <option value="short" data-i18n="catalog.timeShort"></option>
              <option value="medium" data-i18n="catalog.timeMedium"></option>
              <option value="long" data-i18n="catalog.timeLong"></option>
            </select>
          </div>
          <div class="field">
            <label for="filter-steps" data-i18n="catalog.steps"></label>
            <select id="filter-steps" name="steps">
              <option value="all" data-i18n="catalog.all"></option>
              <option value="short" data-i18n="catalog.stepsShort"></option>
              <option value="medium" data-i18n="catalog.stepsMedium"></option>
              <option value="long" data-i18n="catalog.stepsLong"></option>
            </select>
          </div>
          <div class="field">
            <label for="filter-language" data-i18n="catalog.language"></label>
            <select id="filter-language" name="language">
              <option value="all" data-i18n="catalog.all"></option>
              <option value="pt-BR" data-i18n="lang.pt-BR"></option>
              <option value="en" data-i18n="lang.en"></option>
            </select>
          </div>
          <div class="field">
            <label for="filter-use" data-i18n="catalog.use"></label>
            <select id="filter-use" name="use">
              <option value="all" data-i18n="catalog.useAll"></option>
              <option value="brincar" data-i18n="use.brincar"></option>
              <option value="utilizar" data-i18n="use.utilizar"></option>
              <option value="decorar" data-i18n="use.decorar"></option>
              <option value="presentear" data-i18n="use.presentear"></option>
              <option value="aprender" data-i18n="use.aprender"></option>
            </select>
          </div>
          <div class="filter-actions">
            <button type="submit" class="button button-secondary" data-i18n="catalog.clearFilters"></button>
          </div>
        </form>
      </section>

      <p id="catalog-count" role="status" aria-live="polite"></p>

      <div id="catalog-results" class="card-grid" aria-busy="true"></div>
      <p id="catalog-empty" class="note note-warning" hidden data-i18n="catalog.noResults"></p>
    </div>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
